name: investwatch

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  scraper:
    build: ./services/scraper
    environment:
      SCRAPER_PROXIES: ${SCRAPER_PROXIES:-}
      SCRAPER_ALLOW_PRIVATE: ${SCRAPER_ALLOW_PRIVATE:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      retries: 20

  analyzer:
    build: ./services/analyzer
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      retries: 20

  backend:
    build: ./services/backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      SCRAPER_URL: http://scraper:8001
      ANALYZER_URL: http://analyzer:8002
      SCAN_CRON: ${SCAN_CRON:-0 */6 * * *}
      DEFAULT_THRESHOLD: ${DEFAULT_THRESHOLD:-45}
      SEED_DEMO: ${SEED_DEMO:-true}
    volumes:
      - ./data/samples:/app/samples:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      scraper: { condition: service_healthy }
      analyzer: { condition: service_healthy }

  frontend:
    build: ./services/frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:0.5.4
    profiles: ["llm"]
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  redisdata:
  ollama:
