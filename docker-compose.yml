name: investwatch

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  # Valkey (licencja BSD-3) – otwarty fork Redisa zgodny z protokołem; Redis 7.4+ ma licencję RSALv2/SSPLv1
  redis:
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 20

  scraper:
    build: ./services/scraper
    environment:
      SCRAPER_PROXIES: ${SCRAPER_PROXIES:-}
      SCRAPER_ALLOW_PRIVATE: ${SCRAPER_ALLOW_PRIVATE:-false}
      # wideo: model Whisper (tiny/base/small/medium), limity i opcjonalny plik cookies analityka
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_PRELOAD: ${WHISPER_PRELOAD:-true}
      WHISPER_CACHE: /models/whisper
      VIDEO_MAX_SECONDS: ${VIDEO_MAX_SECONDS:-900}
      VIDEO_MAX_MB: ${VIDEO_MAX_MB:-250}
      SCRAPER_COOKIES_FILE: ${SCRAPER_COOKIES_FILE:-}
    volumes:
      - whisper:/models/whisper
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      retries: 20

  analyzer:
    build: ./services/analyzer
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      DEMO_REGISTRY: ${SEED_DEMO:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      retries: 20

  backend:
    build: ./services/backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      SCRAPER_URL: http://scraper:8001
      ANALYZER_URL: http://analyzer:8002
      SCAN_CRON: ${SCAN_CRON:-0 */6 * * *}
      DEFAULT_THRESHOLD: ${DEFAULT_THRESHOLD:-45}
      SEED_DEMO: ${SEED_DEMO:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ENRICH_AUTO: ${ENRICH_AUTO:-true}
      RESERVES_CRON: ${RESERVES_CRON:-30 6 * * *}
      WATCH_CRON: ${WATCH_CRON:-15 */3 * * *}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      VIDEO_WORKER_CONCURRENCY: ${VIDEO_WORKER_CONCURRENCY:-1}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    volumes:
      - ./data/samples:/app/samples:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      scraper: { condition: service_healthy }
      analyzer: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      retries: 20

  frontend:
    build: ./services/frontend
    ports:
      # domyślnie tylko lokalnie (brak uwierzytelniania); WEB_BIND=0.0.0.0 udostępnia w sieci
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      backend: { condition: service_healthy }

  ollama:
    image: ollama/ollama:0.5.4
    profiles: ["llm"]
    volumes:
      - ollama:/root/.ollama

volumes:
  whisper:
  pgdata:
  redisdata:
  ollama:
