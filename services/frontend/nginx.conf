server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 16m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:" always;

  # pliki wideo/reels do 250 MB; transkrypcja odbywa się w tle (zadanie), więc odpowiedź jest szybka
  location = /api/scans/video {
    client_max_body_size 260m;
    proxy_request_buffering off;
    proxy_pass http://backend:4000;
    proxy_set_header Host $http_host;
    proxy_read_timeout 300s;
  }
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $http_host;
    proxy_read_timeout 180s;
  }
  location /socket.io/ {
    proxy_pass http://backend:4000;
    # $http_host zawiera port (np. localhost:8080) – backend porównuje go z nagłówkiem Origin
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
  location / {
    try_files $uri /index.html;
  }
}
