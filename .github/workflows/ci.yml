name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r services/analyzer/requirements-dev.txt pip-audit==2.10.1
      - name: Testy reguł
        working-directory: services/analyzer
        run: python -m pytest -q
      - name: pip-audit
        run: python -m pip_audit -r services/analyzer/requirements.txt -r services/scraper/requirements.txt

  node:
    runs-on: ubuntu-latest
    strategy:
      matrix: { service: [backend, frontend] }
    defaults:
      run: { working-directory: "services/${{ matrix.service }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm audit --audit-level=high
      - if: matrix.service == 'frontend'
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config -q
